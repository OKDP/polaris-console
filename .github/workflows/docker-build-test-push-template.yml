name: build and publish docker image

on:
  workflow_call:
    inputs:
      context:
        description: Docker context for the downstream wrapper image
        required: false
        type: string
        default: "."
      dockerfile:
        description: Downstream Dockerfile path
        required: false
        type: string
        default: docker/Dockerfile
      image:
        description: Image name
        required: false
        type: string
        default: polaris-console
      docker_image_tag:
        description: Docker image tag to build and publish
        required: false
        type: string
        default: ""
      checkout_ref:
        description: Git ref to checkout before building
        required: false
        type: string
        default: ""
      ci_registry:
        description: Registry used to push CI and staged release images
        required: false
        type: string
        default: ghcr.io
      registry:
        description: Registry used to publish public release images
        required: false
        type: string
        default: quay.io
      publish_to_registry:
        description: Whether to promote the staged CI image to the public registry
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  docker-build-push:
    name: Docker build (${{ inputs.image }}:${{ inputs.docker_image_tag }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-tags.outputs.ci_image }}
      tag: ${{ steps.image-tags.outputs.tag }}
      upstream_image: ${{ steps.image-tags.outputs.ci_upstream_image }}
      downstream_image: ${{ steps.image-tags.outputs.ci_downstream_image }}
    steps:
      - name: Checkout Repo
        if: inputs.checkout_ref == ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout ref ${{ inputs.checkout_ref }}
        if: inputs.checkout_ref != ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}

      - name: Read Polaris Console upstream SHA
        id: polaris_console_sh
        uses: ./.github/actions/polaris-console-sha

      - name: Set up QEMU and Docker Buildx
        uses: okdp/gh-workflows/.github/actions/setup-buildx@v1

      - name: Set up container registries
        id: registries
        run: |
          echo "ci_registry=${{ vars.CI_REGISTRY || inputs.ci_registry }}" >> "$GITHUB_OUTPUT"
          echo "ci_registry_repo=${{ vars.CI_REGISTRY || inputs.ci_registry }}/${GITHUB_REPOSITORY_OWNER@L}" >> "$GITHUB_OUTPUT"
          echo "registry=${{ vars.REGISTRY || inputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "registry_repo=${{ vars.REGISTRY || inputs.registry }}/${GITHUB_REPOSITORY_OWNER@L}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: image-tags
        run: |
          CI_IMAGE="${{ steps.registries.outputs.ci_registry_repo }}/${{ inputs.image }}"
          PUBLIC_IMAGE="${{ steps.registries.outputs.registry_repo }}/${{ inputs.image }}"
          TAG="${{ inputs.docker_image_tag }}"

          echo "ci_image=${CI_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ -z "${TAG}" ]]; then
            exit 0
          fi

          SHORT_TAG="$(echo "${TAG}" | awk -F- '{ print $1 }')"

          if [ "${SHORT_TAG}" != "${TAG}" ]; then
            PUBLIC_TAGS="${PUBLIC_IMAGE}:${SHORT_TAG},"
          fi

          PUBLIC_TAGS+="${PUBLIC_IMAGE}:${TAG}"

          echo "ci_upstream_image=${CI_IMAGE}:${TAG}-upstream" >> "$GITHUB_OUTPUT"
          echo "ci_downstream_image=${CI_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "public_tags=${PUBLIC_TAGS}" >> "$GITHUB_OUTPUT"

      - name: Skip Docker publish when image tag is empty
        if: steps.image-tags.outputs.tag == ''
        run: echo "No Docker image tag was resolved. Skipping Docker build and publish."

      - name: Login into ${{ steps.registries.outputs.ci_registry }} registry
        if: steps.image-tags.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registries.outputs.ci_registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push upstream Polaris Console image to CI registry
        if: steps.image-tags.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: https://github.com/apache/polaris-tools.git#${{ steps.polaris_console_sh.outputs.upstream_sha }}:console
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.ci_upstream_image }}

      - name: Build and push downstream OKDP image to CI registry
        if: steps.image-tags.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.ci_downstream_image }}
          build-args: |
            BASE_IMAGE=${{ steps.image-tags.outputs.ci_upstream_image }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.version=${{ steps.image-tags.outputs.tag }}
            org.opencontainers.image.description=OKDP-maintained Docker image for deploying Apache Polaris Console
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Login into ${{ steps.registries.outputs.registry }} registry
        if: inputs.publish_to_registry == true && steps.image-tags.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registries.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_ROBOT_TOKEN }}

      - name: Build and push downstream OKDP image to public registry
        if: inputs.publish_to_registry == true && steps.image-tags.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.public_tags }}
          build-args: |
            BASE_IMAGE=${{ steps.image-tags.outputs.ci_downstream_image }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.version=${{ steps.image-tags.outputs.tag }}
            org.opencontainers.image.description=OKDP-maintained Docker image for deploying Apache Polaris Console
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
