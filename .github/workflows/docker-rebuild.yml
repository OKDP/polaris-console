name: docker-rebuild

on:
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  latest-image-tag:
    runs-on: ubuntu-latest
    outputs:
      docker_image_tag: ${{ steps.latest-image-tag.outputs.tag }}
      checkout_ref: ${{ steps.latest-image-tag.outputs.tag }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest Docker-compatible Git tag
        id: latest-image-tag
        run: |
          tag="$(
            git tag --sort=-creatordate \
              | awk 'NF && $0 ~ /^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$/ { print; exit }'
          )"

          if [[ -z "${tag}" ]]; then
            echo "No Docker-compatible Git tag found. Skipping Docker rebuild."
          else
            echo "Latest Docker-compatible Git tag: ${tag}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  rebuild-docker-image:
    needs: [latest-image-tag]
    if: needs.latest-image-tag.outputs.docker_image_tag != ''
    uses: ./.github/workflows/docker-build-test-push-template.yml
    permissions:
      contents: read
      packages: write
    with:
      image: polaris-console
      docker_image_tag: ${{ needs.latest-image-tag.outputs.docker_image_tag }}
      checkout_ref: ${{ needs.latest-image-tag.outputs.checkout_ref }}
      context: .
      dockerfile: docker/Dockerfile
      publish_to_registry: true
    secrets: inherit
