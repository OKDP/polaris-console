name: release-please

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      docker-release_created: ${{ steps.release-please.outputs.docker--release_created }}
      docker-tag_name: ${{ steps.release-please.outputs.docker--tag_name }}
      docker-version: ${{ steps.release-please.outputs.docker--version }}
      helm-release_created: ${{ steps.release-please.outputs['helm/polaris-console--release_created'] }}
      helm-tag_name: ${{ steps.release-please.outputs['helm/polaris-console--tag_name'] }}
      helm-version: ${{ steps.release-please.outputs['helm/polaris-console--version'] }}
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.repository_owner == 'OKDP' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        id: release-please

  docker-publish:
    needs: [release-please]
    if: github.repository_owner == 'OKDP' && needs.release-please.outputs.docker-release_created == 'true' && needs.release-please.outputs.docker-tag_name != ''
    uses: ./.github/workflows/docker-build-test-push-template.yml
    permissions:
      contents: read
      packages: write
    with:
      image: polaris-console
      docker_image_tag: ${{ needs.release-please.outputs.docker-tag_name }}
      checkout_ref: ${{ needs.release-please.outputs.docker-tag_name }}
      context: .
      dockerfile: docker/Dockerfile
      publish_to_registry: true
    secrets: inherit

  helm-chart-publish:
    needs: [release-please]
    if: github.repository_owner == 'OKDP' && needs.release-please.outputs.helm-release_created == 'true'
    uses: okdp/gh-workflows/.github/workflows/helm-publish-template.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      path: helm/polaris-console
      chart_name: polaris-console
      version: ${{ needs.release-please.outputs.helm-version }}
      git_tag_name: ${{ needs.release-please.outputs.helm-tag_name }}
    secrets: inherit
